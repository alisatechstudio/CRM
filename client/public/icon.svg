<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Vibrant Brand Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="240" r="150" fill="url(#accentGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Main Graphical Emblem -->
  <!-- Computer Screen Outline (Representing Computer / IT) -->
  <rect x="96" y="90" width="320" height="220" rx="28" fill="#13192f" stroke="url(#accentGrad)" stroke-width="12" filter="url(#shadow)" />
  
  <!-- Screen Glass Reflection -->
  <path d="M 104 110 L 290 110 L 104 280 Z" fill="#ffffff" opacity="0.04" />
  
  <!-- Stand & Base for Computer / POS terminal -->
  <path d="M 226 312 L 210 376 L 302 376 L 286 312 Z" fill="#252c4a" stroke="url(#accentGrad)" stroke-width="4" />
  <rect x="160" y="376" width="192" height="18" rx="9" fill="url(#accentGrad)" />

  <!-- Inside Screen: Stylized 'M' Monogram (Mijan) with Retail Sparkle -->
  <path d="M 152 258 L 152 144 L 210 216 L 256 160 L 302 216 L 360 144 L 360 258" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Cosmetics Sparkle / Diamond (Representing Cosmetics & Luxury) -->
  <path d="M 376 96 Q 376 130 406 130 Q 376 130 376 164 Q 376 130 346 130 Q 376 130 376 96 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="376" cy="130" r="5" fill="#ffffff" />

  <path d="M 126 130 Q 126 148 142 148 Q 126 148 126 166 Q 126 148 110 148 Q 126 148 126 130 Z" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Bottom Brand Text Monogram Badge -->
  <rect x="136" y="424" width="240" height="42" rx="21" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="2.5" />
  <text x="256" y="452" font-family="'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3.5">
    MIJAN CRM
  </text>
</svg>
